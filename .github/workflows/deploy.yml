name: Deploy to aaPanel VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # 1. Load môi trường Node.js / NVM trên aaPanel
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            source ~/.bashrc || true
            
            # Cấu hình an toàn cho Git (tránh lỗi Safe Directory của aaPanel)
            git config --global --add safe.directory /www/wwwroot/qb.vietelite.edu.vn
            
            # 2. Truy cập thư mục dự án
            cd /www/wwwroot/qb.vietelite.edu.vn

            # 3. ÉP BUỘC XÓA BỎ THAY ĐỔI LOCAL ĐỂ ĐÓN CODE MỚI
            # Lệnh này sẽ đưa các file .env.example, package.json về trạng thái sạch của commit cũ
            git reset --hard HEAD
            
            # 4. Kéo mã nguồn mới nhất
            git pull origin main

            # 5. ÉP QUYỀN TOÀN BỘ SANG USER WWW TRƯỚC KHI BUILD/INSTALL
            # Bước này cực kỳ quan trọng để tránh tạo ra file thuộc quyền root
            chown -R www:www /www/wwwroot/qb.vietelite.edu.vn

            # 6. Cài đặt dependencies bằng user www và đúng Node của aaPanel
            sudo -u www /www/server/nodejs/v24.16.0/bin/npm install

            # 7. Build dự án Next.js bằng user www
            sudo -u www /www/server/nodejs/v24.16.0/bin/npm run build

            # 8. Khởi động lại PM2 của aaPanel (User www)
            sudo -u www /www/server/nodejs/v24.16.0/bin/pm2 reload vietelite-questionbank || sudo -u www /www/server/nodejs/v24.16.0/bin/pm2 start npm --name "vietelite-questionbank" -- run start -- -p 5002